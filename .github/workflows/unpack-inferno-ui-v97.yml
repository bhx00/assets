name: Unpack Inferno UI V97 assets

on:
  push:
    paths:
      - 'inferno-ui-v97-assets.b64'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inferno-ui-v97
          while IFS='|' read -r name data; do
            [ -z "$name" ] && continue
            printf '%s' "$data" | base64 -d > "inferno-ui-v97/$name"
          done < inferno-ui-v97-assets.b64
          rm -f inferno-ui-v97-assets.b64
          rm -f .github/workflows/unpack-inferno-ui-v97.yml
      - name: Commit decoded assets
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add Inferno UI V97 banner assets'
          git push
