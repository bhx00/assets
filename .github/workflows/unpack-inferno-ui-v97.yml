name: Unpack Inferno UI V97 assets

on:
  push:
    paths:
      - 'inferno-ui-v97-assets-part*.b64'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check and decode assets
        shell: bash
        run: |
          set -euo pipefail
          for n in 1 2 3 4 5; do
            test -f "inferno-ui-v97-assets-part${n}.b64" || { echo "Waiting for all five payload parts"; exit 0; }
          done
          cat inferno-ui-v97-assets-part{1,2,3,4,5}.b64 > /tmp/inferno-ui-v97-assets.b64
          mkdir -p inferno-ui-v97
          while IFS='|' read -r name data; do
            [ -z "$name" ] && continue
            printf '%s' "$data" | base64 -d > "inferno-ui-v97/$name"
          done < /tmp/inferno-ui-v97-assets.b64
          rm -f inferno-ui-v97-assets-part{1,2,3,4,5}.b64
          rm -f .github/workflows/unpack-inferno-ui-v97.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'Add Inferno UI V97 banner assets'
          git push
