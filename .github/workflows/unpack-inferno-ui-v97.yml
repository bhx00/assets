name: Unpack Inferno UI V97 assets

on:
  push:
    paths:
      - 'inferno-ui-v97-staging/*.b64'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode when all assets are staged
        shell: bash
        run: |
          set -euo pipefail
          expected=14
          count=$(find inferno-ui-v97-staging -maxdepth 1 -name '*.b64' -type f 2>/dev/null | wc -l)
          if [ "$count" -ne "$expected" ]; then
            echo "Waiting for all $expected assets; currently $count"
            exit 0
          fi
          mkdir -p inferno-ui-v97
          for f in inferno-ui-v97-staging/*.b64; do
            name=$(basename "$f" .b64)
            base64 -d "$f" > "inferno-ui-v97/$name"
          done
          rm -rf inferno-ui-v97-staging
          rm -f .github/workflows/unpack-inferno-ui-v97.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'Add Inferno UI V97 banner assets'
          git push
